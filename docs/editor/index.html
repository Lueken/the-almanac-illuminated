<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Almanac Guide Editor</title>
<style>
  /* A writing desk, not a dashboard. Warm dark leather, brass accents, serif
     for structure and sans for the things you type into. */
  :root{
    --bg:#1f1b17; --desk:#2a2520; --card:#332d26; --sunk:#241f1b;
    --line:#453c31; --line-soft:#3a322a;
    --text:#ece2cf; --dim:#a99b84; --faint:#7d7263;
    --brass:#c08b45; --brass-dim:#8a6431;
    --bad:#c1685c;
    --parch:#ece1c4; --ink:#231a10;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
         padding:13px 20px;background:var(--desk);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{margin:0;font:400 19px/1.2 Georgia,'Times New Roman',serif;
            letter-spacing:.02em;color:#f2e9d8}
  header .sub{color:var(--faint);font-size:12.5px}
  .grow{flex:1}
  .saved{font-size:12px;color:var(--faint);min-width:78px;text-align:right}

  button{font:inherit;border:1px solid var(--line);background:#3a332b;color:var(--text);
         padding:6px 13px;border-radius:4px;cursor:pointer;transition:background .12s}
  button:hover{background:#463d33;border-color:#584c3e}
  button.primary{background:var(--brass-dim);border-color:#a67c3c;color:#fdf6e8}
  button.primary:hover{background:#9c7238}
  button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:4px 8px}
  button.ghost:hover{background:#3a332b;color:var(--text)}
  button.tiny{padding:2px 8px;font-size:12px}
  button.danger:hover{background:#5a2f28;border-color:#7d4034;color:#f0cdc6}

  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
        height:calc(100vh - 54px)}
  @media (max-width:1040px){.wrap{grid-template-columns:1fr;height:auto}}
  .col{overflow:auto;padding:18px 20px 80px}
  .col.right{background:var(--sunk);border-left:1px solid var(--line)}

  /* --- cards --------------------------------------------------------- */
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:6px;
        margin:0 0 12px}
  .card > .body{padding:2px 15px 14px}
  .card.shut > .body{display:none}

  .head{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;
        user-select:none;border-radius:6px}
  .head:hover{background:#3a332b}
  .head .caret{color:var(--faint);font-size:11px;width:9px;transition:transform .12s}
  .card.shut .head .caret{transform:rotate(-90deg)}
  .head .name{font:400 15px/1.3 Georgia,serif;color:#f0e6d3}
  .head .name .untitled{color:var(--faint);font-style:italic}
  .head .meta{font-size:12px;color:var(--faint)}
  .head .tools{display:flex;gap:2px;opacity:0;transition:opacity .12s}
  .head:hover .tools,.head:focus-within .tools{opacity:1}

  .kicker{font:600 11px/1 system-ui;letter-spacing:.13em;text-transform:uppercase;
          color:var(--faint)}

  /* --- fields -------------------------------------------------------- */
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 3px}
  .field{margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  input[type=text],input[type=number],select,textarea{
    width:100%;font:inherit;padding:6px 9px;border-radius:3px;
    border:1px solid #4a4036;background:#241f1b;color:var(--text)}
  input::placeholder,textarea::placeholder{color:#6b6153}
  textarea{min-height:76px;resize:vertical;font:15px/1.45 Georgia,serif}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass);
    box-shadow:0 0 0 2px rgba(192,139,69,.16)}
  .check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);cursor:pointer}
  .check input{width:15px;height:15px;accent-color:var(--brass-dim)}
  .hint{font-size:12px;color:var(--faint);margin-top:4px}

  /* --- blocks -------------------------------------------------------- */
  .block{background:#2c2721;border:1px solid var(--line-soft);border-left:2px solid #4a4036;
         border-radius:4px;padding:9px 12px 11px;margin:0 0 8px}
  .block:hover{border-left-color:var(--brass-dim)}
  .block .brow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .listrow{display:flex;gap:6px;margin-bottom:5px;align-items:center}
  .listrow input{flex:1}
  .addblock{display:flex;gap:6px;align-items:center;margin-top:10px}
  .addblock select{width:auto;flex:0 1 210px}

  /* --- right column -------------------------------------------------- */
  .tabs{display:flex;gap:4px;margin-bottom:14px;align-items:center}
  .tabs button.on{background:var(--brass-dim);border-color:#a67c3c;color:#fdf6e8}
  .filename{font:12.5px ui-monospace,Consolas,monospace;color:var(--dim);
            background:#1c1815;border:1px solid var(--line-soft);border-radius:4px;
            padding:7px 10px;margin:0 0 10px;overflow:auto;white-space:nowrap}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 12px;
          padding:7px 11px;border-radius:4px;border:1px solid var(--line-soft);
          background:#241f1b;color:var(--dim);cursor:pointer}
  .status .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .status.clean .dot{background:#6f9c5a}
  .status.dirty .dot{background:var(--bad)}
  .status .more{margin-left:auto;color:var(--faint);font-size:11.5px}
  ul.issues{margin:-6px 0 12px;padding:0;list-style:none}
  ul.issues li{padding:5px 11px;border-left:2px solid;margin-bottom:3px;font-size:12.5px;
               background:#241f1b;color:var(--dim)}
  ul.issues li.err{border-color:var(--bad)}
  ul.issues li.warn{border-color:#a8873c}
  pre.json{background:#1c1815;border:1px solid var(--line-soft);border-radius:5px;padding:13px;
           overflow:auto;font:12.5px/1.5 ui-monospace,Consolas,monospace;color:#cfd8c0;
           white-space:pre;margin:0}

  .empty{color:var(--faint);font-style:italic;padding:6px 0 2px;font-size:13.5px}
  .firstrun{text-align:center;padding:24px 20px 10px;color:var(--dim)}
  .firstrun p{margin:0 0 14px;font:15px/1.55 Georgia,serif}

  /* ---- book preview (approximate; the true one is .almpreview in game) ---- */
  .book{background:var(--parch);color:var(--ink);border-radius:3px;padding:26px 30px;
        font-family:Georgia,'Times New Roman',serif;
        background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 2px,transparent 2px 4px),
                         repeating-linear-gradient(90deg,rgba(0,0,0,.012) 0 2px,transparent 2px 4px);
        box-shadow:inset 0 0 60px rgba(90,60,20,.10)}
  .book .runhead{display:flex;align-items:center;gap:10px;justify-content:center;
                 color:#5a4830;font-size:11px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:4px}
  .book .runhead .r{flex:0 0 60px;height:1px;background:#a9906a}
  .book .byline{text-align:center;font-style:italic;color:#6b5a41;font-size:13px;margin:0 0 16px}
  .book h4{margin:14px 0 5px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .book p{margin:0 0 9px;font-size:12.5px;line-height:1.5}
  .book .dropcap{float:left;font-size:37px;line-height:.86;padding:2px 7px 0 0;font-weight:700}
  .book .step{display:flex;gap:9px;align-items:flex-start;margin:0 0 7px}
  .book .num{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;
             color:#f6efdd;font-size:12px;font-weight:700;margin-top:1px}
  .book .bullet{flex:0 0 20px;text-align:center}
  .book .mats{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
  .book .mat{width:60px;text-align:center;font-size:11px;color:#5c4c39}
  .book .mat .slot{width:44px;height:44px;margin:0 auto 3px;border:1px solid #b9a37c;
                   background:#f3ead2;border-radius:3px;display:grid;place-items:center;font-size:9px;color:#93815f;
                   overflow:hidden;word-break:break-all;padding:2px}
  .book .callout{border:1.5px solid;border-radius:4px;padding:8px 10px;margin:10px 0;font-style:italic;font-size:12px}
  .book .callout .seal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
                       color:#fbf3df;font-style:normal;font-weight:700;font-size:12px;margin-right:8px;vertical-align:middle}
  .book .callout .lbl{font-weight:700;font-style:italic}
  .book .quest{margin:0 0 4px;font-style:italic;font-size:12px}
  .book .quest.done{color:#7b6b55;text-decoration:line-through}
  .book .ledger{font-style:italic;font-size:12px;margin:0 0 4px;
                border-bottom:1px solid rgba(120,95,60,.28);padding-bottom:3px}
  .book .divider{display:flex;align-items:center;gap:10px;margin:14px 0}
  .book .divider .r{flex:1;height:1px}
  .book .divider .d{font-size:11px}
  .book .figure{border:1px solid #b9a37c;background:#f3ead2;border-radius:3px;padding:26px;text-align:center;
                color:#93815f;font-size:12px;margin:10px 0 4px;word-break:break-all}
  .book .cap{text-align:center;font-style:italic;font-size:13px;color:#6b5a41;margin:0 0 12px}
  .book a.xref{color:#8a5a22;text-decoration:underline}
  .book .recipe{border:1px dashed #b9a37c;padding:10px;text-align:center;color:#7d6a4c;font-size:12.5px;margin:10px 0}
  .book .grid-recipe{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 2px}
  .book .grid-recipe .cells{display:grid;gap:3px}
  .book .grid-recipe .cell{width:34px;height:34px;border:1px solid #b9a37c;background:#f3ead2;border-radius:2px;
                           position:relative;display:grid;place-items:center;overflow:hidden;padding:1px}
  .book .grid-recipe .cell .code{font-size:7.5px;line-height:1.05;color:#6b5a41;text-align:center;word-break:break-all}
  .book .grid-recipe .cell .qty{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:700;color:#3f3223}
  .book .grid-recipe .cell.out{width:40px;height:40px;border-color:#8a6c33}
  .book .grid-recipe .arrow{color:#7d6a4c;font-size:17px}
  .book .fig-full{margin:10px 0 4px}
  .book .fig-full img{width:100%;display:block;border:1px solid #7c6a4d}
  .book .fig-left,.book .fig-right{width:50%;margin:4px 0 8px}
  .book .fig-left{float:left;padding-right:12px}
  .book .fig-right{float:right;padding-left:12px}
  .book .fig-left img,.book .fig-right img{width:100%;display:block;border:1px solid #7c6a4d}
  .book .locked{font-style:italic;color:#8a795f;font-size:12px}
  .book .contents{color:#7b6b55;font-size:14px}
  .book .pagenum{text-align:center;color:#6b5a41;font-style:italic;font-size:13px;margin-top:20px}
  .book:after{content:'';display:block;clear:both}
  .spreadview{position:relative;overflow:hidden}
  .pages{column-fill:auto;transition:transform .18s ease-out}
  .pages > *{break-inside:auto}
  .pages .sec.keep{break-inside:avoid}
  .pages .sec.newpage{break-before:column}
  .gutter{position:absolute;top:0;bottom:0;width:1px;background:rgba(90,70,45,.30);pointer-events:none}
  .furniture{position:absolute;inset:0;pointer-events:none}
  .furniture .rh{position:absolute;top:2px;text-align:center;color:#5a4830;font-size:8.5px;
                 letter-spacing:.30em;text-transform:uppercase;display:flex;align-items:center;gap:7px;justify-content:center}
  .furniture .rh i{flex:0 0 34px;height:1px;background:#a9906a;display:block}
  .furniture .pn{position:absolute;bottom:2px;text-align:center;color:#6b5a41;font-style:italic;font-size:11px}
  .pager{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px;color:var(--faint);font-size:12.5px}
  .pager button{padding:3px 11px}
  .pager .of{min-width:96px;text-align:center}
</style>
</head>
<body>

<header>
  <h1>The Almanac Guide Editor</h1>
  <span class="sub">writes a guide pack for your mod</span>
  <span class="grow"></span>
  <span class="saved" id="saved"></span>
  <button id="btn-new" class="ghost">New</button>
  <button id="btn-example" class="ghost">Example</button>
  <button id="btn-import">Open a guide</button>
  <button id="btn-copy">Copy</button>
  <button id="btn-download" class="primary">Download</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>

<div class="wrap">
  <div class="col left" id="editor"></div>
  <div class="col right">
    <div class="tabs">
      <button id="tab-preview" class="on">Preview</button>
      <button id="tab-json">JSON</button>
    </div>
    <div class="filename" id="filename"></div>
    <div class="status" id="status"></div>
    <ul class="issues" id="issues" hidden></ul>
    <div id="pane-preview">
      <div class="book" id="book"></div>
      <div class="pager" id="pager"></div>
      <div class="hint" style="text-align:center">Page breaks are approximate. The book itself is the authority; check it with <code>.almpreview</code>.</div>
    </div>
    <div id="pane-json" hidden><pre class="json" id="json"></pre></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Block spec. Mirrors docs/SCHEMA.md §5 and docs/guide-pack.schema.json.
   Field types: text, area (multiline), bool, num, select, list (string array),
   mats (material objects), quest (quest items).
--------------------------------------------------------------------------- */
const BLOCKS = {
  heading:   {label:'Heading', fields:[['text','Text','text',true],['level','Level (1 to 3)','num']]},
  paragraph: {label:'Paragraph', fields:[['text','Text (inline VTML allowed)','area',true],['dropcap','Illuminated first letter','bool']]},
  dropcap:   {label:'Drop cap', fields:[['letter','Letter','text',true]]},
  steps:     {label:'Steps', fields:[['items','Steps','list',true],['ordered','Numbered (off = bulleted)','bool',false,true]]},
  materials: {label:'Materials', fields:[['items','Items','mats',true]]},
  recipe:    {label:'Recipe', fields:[['recipe','Recipe code (one recipe)','text'],['output','Output item code (every recipe making it)','text']]},
  callout:   {label:'Callout', fields:[['variant','Variant','select',true,'author',['author','tip','warning','lore']],['text','Text (plain; VTML is NOT parsed here)','area',true],['icon','Icon code (optional)','text']]},
  quest:     {label:'Quest checklist', fields:[['questId','Quest id (Progression Framework, optional)','text'],['items','Objectives','quest',true]]},
  figure:    {label:'Figure', fields:[['image','Image path (domain:textures/…png)','text',true],['caption','Caption','text'],['align','Align','select',false,'full',['full','left','right']]]},
  ledger:    {label:'Field ledger', fields:[['entries','Entries','list',true]]},
  divider:   {label:'Divider', fields:[['ornament','Ornament (optional)','text']]},
  link:      {label:'Link', fields:[['to','Target (almanac://chapter/id · handbook://page · https://…)','text',true],['text','Link text','text',true]]},
  contents:  {label:'Contents (auto mod list)', fields:[['include','Include','select',false,'added',['added','all']]]},
  table:     {label:'Table (deferred to v0.2)', fields:[]},
};
const CALLOUT_COLORS = {
  author:{fill:'#f7f0d9',line:'#b82114'}, tip:{fill:'#e8f5e3',line:'#267333'},
  warning:{fill:'#f7edd1',line:'#a6660d'}, lore:{fill:'#e8e6f7',line:'#40338c'},
};

/* Preview-only assets, keyed by the live block object. The game resolves
   figures from mod assets and recipes from its own registry; a browser can
   reach neither. So the author points at the same files they ship, purely to
   see them here. NOTHING from this map is ever written to the JSON. */
const previewAssets = new WeakMap();

/** Vintage Story's JSON is relaxed: unquoted keys, comments, trailing commas. */
function parseRelaxedJson(text){
  let t = text.replace(/^\uFEFF/, '')
              .replace(/\/\*[\s\S]*?\*\//g, '')
              .replace(/(^|[^:"'\\])\/\/.*$/gm, '$1');
  // Quote bare keys, but not inside strings: split on strings first.
  t = t.split(/("(?:\\.|[^"\\])*")/).map((part,i)=>
        i % 2 ? part : part.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
      ).join('');
  t = t.replace(/,(\s*[}\]])/g, '$1');
  return JSON.parse(t);
}

/** Pull a drawable grid out of a VS grid-recipe file. */
function readRecipeFile(text){
  const r = parseRelaxedJson(text);
  const rows = String(r.ingredientPattern || '').split(',');
  const h = r.height || rows.length || 3;
  const w = r.width || (rows[0] ? rows[0].length : 3);
  const cells = [];
  for(let y=0; y<h; y++){
    for(let x=0; x<w; x++){
      const ch = (rows[y] || '')[x] || '_';
      const ing = ch === '_' ? null : (r.ingredients || {})[ch];
      cells.push(!ing ? null : {
        code: ing.code || (ing.tags ? '#'+ing.tags[0] : (ing.name || ch)),
        qty: ing.quantity || 1,
        tool: !!ing.isTool,
      });
    }
  }
  const out = r.output || {};
  return {w, h, cells, name:r.name || '', output:{code: out.code || '', qty: out.quantity || 1}};
}

let doc = blankDoc();
function blankDoc(){
  return {schemaVersion:1, $schema:'', id:'', gate:'', title:'', subtitle:'', byline:'', icon:'',
          accentColor:'', order:null, overview:false, pinned:false, sections:[newSection()]};
}
function newSection(){ return {id:'', title:'', keepTogether:false, pageBreakBefore:false, revealedBy:'', hint:'', blocks:[]}; }
function newBlock(type){
  const b = {type};
  const spec = BLOCKS[type];
  if(spec) for(const [k,,t,,def] of spec.fields){
    if(def !== undefined) b[k] = def;
    else if(t==='list'||t==='mats'||t==='quest') b[k] = [];
  }
  return b;
}

/* ------------------------------ editor render ---------------------------- */
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; };

function field(label, value, oninput, opts={}){
  const w = el('div','field');
  if(label) w.appendChild(el('label',null,label));
  let inp;
  if(opts.type==='area'){ inp = el('textarea'); }
  else if(opts.type==='select'){
    inp = el('select');
    (opts.options||[]).forEach(o=>{ const op=el('option',null,o); op.value=o; inp.appendChild(op); });
  } else { inp = el('input'); inp.type = opts.type==='num' ? 'number' : 'text'; }
  inp.value = value==null ? '' : value;
  if(opts.placeholder) inp.placeholder = opts.placeholder;
  inp.addEventListener('input', ()=>{ oninput(inp.value); refresh(); });
  w.appendChild(inp);
  if(opts.hint) w.appendChild(el('div','hint',opts.hint));
  return w;
}
function checkbox(label, value, onchange){
  const w = el('div','field'); const l = el('label','check');
  const c = el('input'); c.type='checkbox'; c.checked=!!value;
  c.addEventListener('change', ()=>{ onchange(c.checked); refresh(); });
  l.appendChild(c); l.appendChild(el('span',null,label)); w.appendChild(l); return w;
}
function listEditor(arr, onchange, placeholder){
  const w = el('div');
  arr.forEach((v,i)=>{
    const row = el('div','listrow');
    const inp = el('input'); inp.type='text'; inp.value=v; inp.placeholder=placeholder||'';
    inp.addEventListener('input', ()=>{ arr[i]=inp.value; refresh(); });
    const del = el('button','tiny danger','×');
    del.onclick = ()=>{ arr.splice(i,1); onchange(); render(); };
    row.appendChild(inp); row.appendChild(del); w.appendChild(row);
  });
  const add = el('button','tiny','+ add');
  add.onclick = ()=>{ arr.push(''); onchange(); render(); };
  w.appendChild(add);
  return w;
}
function objListEditor(arr, cols, onchange){
  const w = el('div');
  arr.forEach((o,i)=>{
    const row = el('div','listrow');
    cols.forEach(([k,ph,type])=>{
      let inp;
      if(type==='bool'){
        const l = el('label','check'); inp = el('input'); inp.type='checkbox'; inp.checked=!!o[k];
        inp.addEventListener('change',()=>{ o[k]=inp.checked; refresh(); });
        l.appendChild(inp); l.appendChild(el('span',null,ph)); row.appendChild(l); return;
      }
      inp = el('input'); inp.type='text'; inp.value=o[k]||''; inp.placeholder=ph;
      inp.addEventListener('input', ()=>{ o[k]=inp.value; refresh(); });
      row.appendChild(inp);
    });
    const del = el('button','tiny danger','×');
    del.onclick = ()=>{ arr.splice(i,1); onchange(); render(); };
    row.appendChild(del); w.appendChild(row);
  });
  const add = el('button','tiny','+ add');
  add.onclick = ()=>{ const o={}; cols.forEach(([k])=>o[k]=''); arr.push(o); onchange(); render(); };
  w.appendChild(add); return w;
}

/* Collapse state lives outside the doc so it can never reach the JSON. */
const shut = new WeakSet();

function cardHead(target, nameHtml, metaText, tools){
  const head = el('div','head');
  head.appendChild(el('span','caret','▾'));
  const name = el('div','name'); name.innerHTML = nameHtml;
  head.appendChild(name);
  if(metaText) head.appendChild(el('span','meta', metaText));
  head.appendChild(el('span','grow'));
  if(tools){ const t = el('div','tools'); tools.forEach(b=>t.appendChild(b)); head.appendChild(t); }
  head.onclick = e=>{
    if(e.target.closest('button')) return;      // tools act, they do not collapse
    if(shut.has(target)) shut.delete(target); else shut.add(target);
    render();
  };
  return head;
}

function render(){
  const root = $('#editor'); root.innerHTML='';

  /* --- chapter --- */
  const m = el('div','card');
  const titled = (doc.title||'').trim();
  m.appendChild(cardHead(doc,
    titled ? esc(titled) : '<span class="untitled">Untitled chapter</span>',
    doc.id || ''));
  const mb = el('div','body');
  const g1 = el('div','grid2');
  g1.appendChild(field('Chapter id', doc.id, v=>doc.id=v,
    {placeholder:'yourname:chapter', hint:'Namespaced so two authors never collide.'}));
  g1.appendChild(field('Gate', doc.gate, v=>doc.gate=v,
    {placeholder:'yourmodid', hint:'The chapter shows only when this mod is loaded. Blank shows always.'}));
  mb.appendChild(g1);
  mb.appendChild(field('Title', doc.title, v=>doc.title=v, {placeholder:'Fieldwright'}));
  const g2 = el('div','grid2');
  g2.appendChild(field('Subtitle', doc.subtitle, v=>doc.subtitle=v));
  g2.appendChild(field('Byline', doc.byline, v=>doc.byline=v, {placeholder:'set down by Venah'}));
  mb.appendChild(g2);
  const g3 = el('div','grid3');
  g3.appendChild(field('Icon', doc.icon, v=>doc.icon=v, {placeholder:'yourmod:item/rod'}));
  g3.appendChild(field('Accent colour', doc.accentColor, v=>doc.accentColor=v, {placeholder:'#7a5a2e'}));
  g3.appendChild(field('Order', doc.order, v=>doc.order = v===''?null:parseInt(v,10), {type:'num'}));
  mb.appendChild(g3);
  const g4 = el('div','grid2');
  g4.appendChild(checkbox('Landing page for the book', doc.overview, v=>doc.overview=v));
  g4.appendChild(checkbox('Pin above the letter tabs', doc.pinned, v=>doc.pinned=v));
  mb.appendChild(g4);
  mb.appendChild(field('$schema', doc.$schema, v=>doc.$schema=v,
    {placeholder:'https://…/guide-pack.schema.json', hint:'Optional. Gives code editors autocomplete on the file.'}));
  mb.appendChild(el('div','hint','Any text field takes a literal, or a #langkey such as #yourmod:chapter-title.'));
  m.appendChild(mb);
  if(shut.has(doc)) m.classList.add('shut');
  root.appendChild(m);

  /* --- sections --- */
  doc.sections.forEach((sec,si)=>{
    const c = el('div','card');
    const t = (sec.title||'').trim();
    const n = sec.blocks.length;
    const tools = [];
    const up = el('button','ghost tiny','↑'); up.title='Move up';
    up.onclick=()=>{ if(si>0){ doc.sections.splice(si-1,0,doc.sections.splice(si,1)[0]); render(); } };
    const dn = el('button','ghost tiny','↓'); dn.title='Move down';
    dn.onclick=()=>{ if(si<doc.sections.length-1){ doc.sections.splice(si+1,0,doc.sections.splice(si,1)[0]); render(); } };
    const rm = el('button','ghost tiny danger','Remove'); rm.title='Remove this section';
    rm.onclick=()=>{ if(n && !confirm(`Remove this section and its ${n} block${n===1?'':'s'}?`)) return;
                     doc.sections.splice(si,1); if(!doc.sections.length) doc.sections.push(newSection()); render(); };
    tools.push(up,dn,rm);

    c.appendChild(cardHead(sec,
      `${si+1}. ` + (t ? esc(t) : '<span class="untitled">Continuation</span>'),
      n ? `${n} block${n===1?'':'s'}` : 'empty', tools));

    const b = el('div','body');
    const sg = el('div','grid2');
    sg.appendChild(field('Section title', sec.title, v=>sec.title=v,
      {hint:'Leave blank to continue the section before it.'}));
    sg.appendChild(field('Section id', sec.id, v=>sec.id=v,
      {placeholder:'getting-started', hint:'Anchor for links. Keep it stable once links point at it.'}));
    b.appendChild(sg);
    const sg2 = el('div','grid2');
    sg2.appendChild(checkbox('Keep on one page', sec.keepTogether, v=>sec.keepTogether=v));
    sg2.appendChild(checkbox('Start a new page', sec.pageBreakBefore, v=>sec.pageBreakBefore=v));
    b.appendChild(sg2);
    const sg3 = el('div','grid2');
    sg3.appendChild(field('Revealed by', sec.revealedBy, v=>sec.revealedBy=v,
      {placeholder:'almanactcm:met-first-mass', hint:'Until earned, the blocks give way to a hint line.'}));
    sg3.appendChild(field('Hint while unrevealed', sec.hint, v=>sec.hint=v,
      {placeholder:'This page waits for practiced hands.'}));
    b.appendChild(sg3);

    if(!n) b.appendChild(el('div','empty','Nothing on this page yet.'));
    sec.blocks.forEach((bl,bi)=>b.appendChild(blockCard(sec,bl,bi)));

    const addRow = el('div','addblock');
    const sel = el('select');
    Object.entries(BLOCKS).forEach(([k,v])=>{ const o=el('option',null,v.label); o.value=k; sel.appendChild(o); });
    const add = el('button','tiny','Add');
    add.onclick = ()=>{ sec.blocks.push(newBlock(sel.value)); shut.delete(sec); render(); };
    addRow.append(sel,add);
    b.appendChild(addRow);

    c.appendChild(b);
    if(shut.has(sec)) c.classList.add('shut');
    root.appendChild(c);
  });

  const addSec = el('button','primary','Add a section');
  addSec.onclick = ()=>{ const s2=newSection(); doc.sections.push(s2); render(); };
  root.appendChild(addSec);

  refresh();
}

function blockCard(sec, b, bi){
  const c = el('div','block');
  const head = el('div','brow');
  head.appendChild(el('span','kicker', (BLOCKS[b.type]||{}).label || b.type));
  head.appendChild(el('span','grow'));
  const up = el('button','ghost tiny','↑'); up.title='Move up';
  up.onclick=()=>{ if(bi>0){ sec.blocks.splice(bi-1,0,sec.blocks.splice(bi,1)[0]); render(); } };
  const dn = el('button','ghost tiny','↓'); dn.title='Move down';
  dn.onclick=()=>{ if(bi<sec.blocks.length-1){ sec.blocks.splice(bi+1,0,sec.blocks.splice(bi,1)[0]); render(); } };
  const rm = el('button','ghost tiny danger','×'); rm.title='Remove this block';
  rm.onclick=()=>{ sec.blocks.splice(bi,1); render(); };
  head.append(up,dn,rm); c.appendChild(head);

  const spec = BLOCKS[b.type];
  if(!spec){ c.appendChild(el('div','empty','Unknown block type.')); return c; }

  spec.fields.forEach(([k,label,type,,def,options])=>{
    if(type==='bool'){ c.appendChild(checkbox(label, b[k], v=>b[k]=v)); return; }
    if(type==='list'){
      const w=el('div','field'); w.appendChild(el('label',null,label));
      if(!Array.isArray(b[k])) b[k]=[];
      w.appendChild(listEditor(b[k], ()=>{}, 'text')); c.appendChild(w); return;
    }
    if(type==='mats'){
      const w=el('div','field'); w.appendChild(el('label',null,label));
      if(!Array.isArray(b[k])) b[k]=[];
      w.appendChild(objListEditor(b[k], [['code','game:ingot-iron'],['label','label (optional)'],['count','count']], ()=>{}));
      c.appendChild(w); return;
    }
    if(type==='quest'){
      const w=el('div','field'); w.appendChild(el('label',null,label));
      if(!Array.isArray(b[k])) b[k]=[];
      w.appendChild(objListEditor(b[k], [['text','objective'],['done','done','bool']], ()=>{}));
      c.appendChild(w); return;
    }
    c.appendChild(field(label, b[k], v=>b[k]=(type==='num' && v!=='')?parseInt(v,10):v,
      {type, options, placeholder: def||''}));
  });

  // `requires` is common to every block type (SCHEMA.md §5): the block renders
  // only when every listed mod is loaded.
  c.appendChild(field('Requires: modids, comma separated (blank = always)',
    (b.requires||[]).join(', '),
    v=>{ const a = v.split(',').map(x=>x.trim()).filter(Boolean);
         if(a.length) b.requires = a; else delete b.requires; },
    {placeholder:'industrialstory, smithingplus'}));

  // Preview-only asset loaders. The game reads these from your mod at runtime;
  // the browser cannot, so point at the same file to see it here.
  if(b.type === 'figure') c.appendChild(assetLoader(b, 'image',
    'Preview this image', 'image/png,image/jpeg',
    (file, done)=>{ const r=new FileReader();
      r.onload=()=>done({img:r.result, name:file.name}); r.readAsDataURL(file); }));

  if(b.type === 'recipe') c.appendChild(assetLoader(b, 'recipe',
    'Preview from recipe .json', '.json,application/json',
    (file, done)=>{ const r=new FileReader();
      r.onload=()=>{ try{ done({recipe:readRecipeFile(r.result), name:file.name}); }
                     catch(err){ alert('Could not read that recipe: '+err.message); } };
      r.readAsText(file); }));

  return c;
}

/** A "load a local file for preview" row. Never touches the exported JSON. */
function assetLoader(block, kind, label, accept, read){
  const w = el('div','field');
  const row = el('div','listrow');
  const btn = el('button','tiny', label);
  const inp = el('input'); inp.type='file'; inp.accept=accept; inp.hidden=true;
  const have = previewAssets.get(block);
  const status = el('span','hint',
    have && have.name ? `previewing ${have.name}` : 'preview only, not saved in the JSON');
  btn.onclick = ()=>inp.click();
  inp.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    read(f, data=>{ previewAssets.set(block, data); render(); });
    e.target.value='';
  };
  row.append(btn, status);
  w.append(row, inp);
  if(have){
    const clear = el('button','tiny danger','clear preview');
    clear.onclick = ()=>{ previewAssets.delete(block); render(); };
    row.appendChild(clear);
  }
  return w;
}

/* ------------------------------ output ----------------------------------- */
function buildJson(){
  const o = {};
  // Kept first when present: editors use it for autocomplete against the schema.
  if(doc.$schema) o.$schema = doc.$schema;
  o.schemaVersion = 1;
  const put=(k,v)=>{ if(v!==''&&v!=null&&v!==false) o[k]=v; };
  put('id',doc.id); put('gate',doc.gate); put('title',doc.title);
  put('subtitle',doc.subtitle); put('byline',doc.byline); put('icon',doc.icon);
  put('accentColor',doc.accentColor);
  if(doc.order!=null && !Number.isNaN(doc.order)) o.order=doc.order;
  if(doc.overview) o.overview=true;
  if(doc.pinned) o.pinned=true;
  o.sections = doc.sections.map(s=>{
    const x={};
    if(s.id) x.id=s.id;
    if(s.title) x.title=s.title;
    if(s.keepTogether) x.keepTogether=true;
    if(s.pageBreakBefore) x.pageBreakBefore=true;
    if(s.revealedBy) x.revealedBy=s.revealedBy;
    if(s.hint) x.hint=s.hint;
    x.blocks = s.blocks.map(b=>{
      const y={type:b.type};
      if(Array.isArray(b.requires) && b.requires.length) y.requires = b.requires.slice();
      const spec=BLOCKS[b.type]; if(!spec) return y;
      spec.fields.forEach(([k,,t])=>{
        const v=b[k];
        if(v===undefined||v===null||v==='') return;
        if(t==='list'){ const a=v.filter(z=>z!==''); if(a.length) y[k]=a; return; }
        if(t==='mats'){ const a=v.filter(z=>z.code).map(z=>{const m={code:z.code}; if(z.label)m.label=z.label; if(z.count)m.count=parseInt(z.count,10)||1; return m;}); if(a.length) y[k]=a; return; }
        if(t==='quest'){ const a=v.filter(z=>z.text).map(z=>{const m={text:z.text}; if(z.done)m.done=true; return m;}); if(a.length) y[k]=a; return; }
        if(t==='bool'){ if(v===true||v===false) y[k]=v; return; }
        y[k]=v;
      });
      return y;
    });
    return x;
  });
  return o;
}

function validate(o){
  const out=[];
  if(!o.id) out.push(['err','Chapter needs an id. Namespace it, e.g. yourname:chapter.']);
  else if(!o.id.includes(':')) out.push(['warn','Chapter id has no namespace; collisions with other authors become possible.']);
  if(!o.title) out.push(['err','Chapter needs a title.']);
  if(o.accentColor && !/^#[0-9a-fA-F]{6}$/.test(o.accentColor)) out.push(['err','accentColor must look like #7a5a2e.']);
  if(o.overview && o.gate) out.push(['err','overview is for gate-less chapters only. Clear the gate or the overview flag.']);
  // order IS honoured on a gated chapter when it is pinned: the pinned band
  // sorts by order, then id (SCHEMA.md §3). Only warn for the unpinned case.
  if(o.order!=null && o.gate && !o.pinned)
    out.push(['warn','order is ignored on gated chapters unless the chapter is pinned.']);

  (o.sections||[]).forEach((s,i)=>{
    const n = s.title ? `"${s.title}"` : `#${i+1}`;
    if(!s.blocks || !s.blocks.length) out.push(['warn',`Section ${n} has no blocks.`]);
    if(s.revealedBy && !s.revealedBy.includes(':')) out.push(['err',`Section ${n}: revealedBy must be namespace:key.`]);
    (s.blocks||[]).forEach(b=>{
      const L = (BLOCKS[b.type]||{}).label || b.type;
      if(b.type==='table') out.push(['warn',`${L} is deferred to v0.2. The engine skips it and warns.`]);
      if(b.type==='recipe'){
        if(b.recipe && b.output) out.push(['err','Recipe block: set recipe OR output, never both.']);
        if(!b.recipe && !b.output) out.push(['err','Recipe block needs a recipe code or an output item code.']);
      }
      if(b.type==='heading' && !b.text) out.push(['err','Heading needs text.']);
      if(b.type==='paragraph' && !b.text) out.push(['err','Paragraph needs text.']);
      if(b.type==='figure' && !b.image) out.push(['err','Figure needs an image path.']);
      if(b.type==='link' && !b.to) out.push(['err','Link needs a target.']);
      if(b.type==='callout' && /<[a-z]/i.test(b.text||'')) out.push(['warn','Callout text is plain. VTML tags will show literally inside the box.']);
      if(b.type==='steps' && !(b.items||[]).length) out.push(['warn','Steps block is empty.']);
      if(b.type==='materials' && !(b.items||[]).length) out.push(['warn','Materials block is empty.']);
    });
  });
  return out;
}

/* --------------------------- preview (approximate) ----------------------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function inlineVtml(s){
  // Approximate the inline subset for preview only.
  return esc(s)
    .replace(/&lt;strong&gt;(.*?)&lt;\/strong&gt;/g,'<strong>$1</strong>')
    .replace(/&lt;i&gt;(.*?)&lt;\/i&gt;/g,'<em>$1</em>')
    .replace(/&lt;a href="(.*?)"&gt;(.*?)&lt;\/a&gt;/g,'<a class="xref" href="#" onclick="return false">$2</a>')
    .replace(/&lt;itemstack code="(.*?)"\s*\/&gt;/g,'<span class="xref">[$1]</span>')
    .replace(/&lt;icon name="(.*?)"\s*\/&gt;/g,'<span class="xref">[$1]</span>');
}
function lang(s){ return (s||'').startsWith('#') ? s.slice(1).split(':').pop().replace(/-/g,' ') : (s||''); }

/** Renders the live editor doc (not the built JSON) so preview-only assets,
 *  which are keyed by block identity, can be drawn. */
function preview(o){
  const accent = /^#[0-9a-fA-F]{6}$/.test(o.accentColor||'') ? o.accentColor : '#7a5a2e';
  let h = '';

  (o.sections||[]).forEach(s=>{
    const secCls = 'sec' + (s.keepTogether?' keep':'') + (s.pageBreakBefore?' newpage':'');
    h += `<div class="${secCls}">`;
    if(s.title) h += `<h4>${esc(lang(s.title))}</h4>`;
    if(s.revealedBy){
      h += `<div class="locked">${esc(lang(s.hint)||'This page waits for practiced hands.')}</div></div>`;
      return;   // unrevealed sections hide their blocks
    }
    (s.blocks||[]).forEach(b=>{
      switch(b.type){
        case 'heading': h += `<h4>${esc(lang(b.text))}</h4>`; break;
        case 'paragraph': {
          let t = lang(b.text)||'';
          let cap = '';
          if(b.dropcap && t.length){ cap = `<span class="dropcap" style="color:${accent}">${esc(t[0])}</span>`; t = t.slice(1); }
          h += `<p>${cap}${inlineVtml(t)}</p>`; break;
        }
        case 'dropcap': h += `<p><span class="dropcap" style="color:${accent}">${esc(b.letter||'')}</span></p>`; break;
        case 'steps': {
          const ordered = b.ordered !== false;
          (b.items||[]).forEach((it,i)=>{
            h += `<div class="step">${ordered
              ? `<span class="num" style="background:${accent}">${i+1}</span>`
              : `<span class="bullet">•</span>`}<span>${inlineVtml(lang(it))}</span></div>`;
          });
          break;
        }
        case 'materials': {
          h += '<div class="mats">';
          (b.items||[]).forEach(m=>{
            h += `<div class="mat"><div class="slot">${esc((m.code||'').split(':').pop())}</div>${esc(m.label||'')}${m.count?' ×'+esc(m.count):''}</div>`;
          });
          h += '</div>'; break;
        }
        case 'recipe': {
          const pa = previewAssets.get(b);
          if(pa && pa.recipe){
            const g = pa.recipe;
            let cells = '';
            g.cells.forEach(c=>{
              cells += `<div class="cell">${c
                ? `<span class="code">${esc(String(c.code).split(':').pop())}</span>${c.qty>1?`<span class="qty">${c.qty}</span>`:''}`
                : ''}</div>`;
            });
            h += `<div class="grid-recipe">
                    <div class="cells" style="grid-template-columns:repeat(${g.w},34px)">${cells}</div>
                    <div class="arrow">→</div>
                    <div class="cell out"><span class="code">${esc(String(g.output.code).split(':').pop())}</span>${g.output.qty>1?`<span class="qty">${g.output.qty}</span>`:''}</div>
                  </div>
                  <div class="cap">the book draws this live from the game's recipe registry</div>`;
          } else {
            let cells=''; for(let i=0;i<9;i++) cells += '<div class="cell"></div>';
            h += `<div class="grid-recipe">
                    <div class="cells" style="grid-template-columns:repeat(3,34px)">${cells}</div>
                    <div class="arrow">→</div><div class="cell out"></div>
                  </div>
                  <div class="cap">${esc(b.recipe||b.output||'(no recipe set)')} (drawn live in game; load the recipe .json to preview it here)</div>`;
          }
          break;
        }
        case 'callout': {
          const c = CALLOUT_COLORS[b.variant||'author'];
          const seal = (b.variant||'author')==='author'
            ? `<span class="seal" style="background:${c.line}">${esc((lang(o.byline)||'A').replace(/.*by /i,'').trim()[0]||'A')}</span>` : '';
          const label = (b.variant||'author')==='author' ? `<span class="lbl">From the Author's Hand:</span><br>` : '';
          h += `<div class="callout" style="background:${c.fill};border-color:${c.line}">${seal}${label}${esc(lang(b.text))}</div>`;
          break;
        }
        case 'quest': (b.items||[]).forEach(q=>{
            h += `<div class="quest${q.done?' done':''}">${q.done?'☑':'☐'} ${esc(lang(q.text))}</div>`; }); break;
        case 'ledger': (b.entries||[]).forEach(e=>{ h += `<div class="ledger">${esc(lang(e))}</div>`; }); break;
        case 'divider':
          h += `<div class="divider"><span class="r" style="background:${accent};opacity:.5"></span><span class="d" style="color:${accent}">${esc(b.ornament||'❦')}</span><span class="r" style="background:${accent};opacity:.5"></span></div>`;
          break;
        case 'figure': {
          const pa = previewAssets.get(b);
          const align = b.align || 'full';
          const cls = align === 'full' ? 'fig-full' : (align === 'right' ? 'fig-right' : 'fig-left');
          if(pa && pa.img){
            h += `<div class="${cls}"><img src="${pa.img}" alt="">` +
                 (b.caption ? `<div class="cap">${esc(lang(b.caption))}</div>` : '') + `</div>`;
          } else {
            h += `<div class="${cls}"><div class="figure">▣ ${esc(b.image||'(no image)')}<br>` +
                 `<span style="font-size:10px">align: ${esc(align)} (load the PNG to preview it here)</span></div>` +
                 (b.caption ? `<div class="cap">${esc(lang(b.caption))}</div>` : '') + `</div>`;
          }
          break;
        }
        case 'link': h += `<p><a class="xref" href="#" onclick="return false">${esc(lang(b.text)||b.to)}</a></p>`; break;
        case 'contents': h += `<div class="contents">· auto contents (${esc(b.include||'added')} mods) ·</div>`; break;
        case 'table': h += `<div class="recipe">table: deferred to v0.2, the engine skips this</div>`; break;
      }
    });
    h += '</div>';
  });
  return h;
}

/* ------------------------------ wiring ----------------------------------- */
/* Two-page spread view. CSS columns do the flowing: a column is a page, so
   keepTogether maps to break-inside:avoid and pageBreakBefore to
   break-before:column, which is what the engine means by them. The real
   paginator is the game's; this is close enough to see where breaks land. */
let spread = 0;
const GUTTER = 34;

function layoutSpread(){
  const view = $('#spreadview'), pages = $('#pages'), gutter = $('#gutter');
  if(!view || !pages) return;
  const total = view.clientWidth;
  if(total < 80) return;
  const pageW = Math.floor((total - GUTTER) / 2);
  const pageH = Math.max(320, Math.round(pageW * 1.34));

  view.style.height = pageH + 'px';
  pages.style.height = (pageH - 42) + 'px';
  pages.style.paddingTop = '22px';
  pages.style.paddingBottom = '20px';
  pages.style.width = (pageW * 2 + GUTTER) + 'px';
  pages.style.columnWidth = pageW + 'px';
  pages.style.columnGap = GUTTER + 'px';
  gutter.style.left = (pageW + GUTTER / 2) + 'px';

  // Column count comes from how far the content actually runs.
  // Furniture rides over the flow on every page, the way the book draws it:
  // running heads at the top, page numbers at the foot.
  const chapter = (doc.title||'').trim() || 'The Almanac';
  const f = $('#furniture');
  f.innerHTML = '';
  [0,1].forEach(side=>{
    const x = side ? pageW + GUTTER : 0;
    const rh = el('div','rh');
    rh.innerHTML = '<i></i>' + esc(side ? chapter : 'The Almanac') + '<i></i>';
    rh.style.left = x + 'px'; rh.style.width = pageW + 'px';
    const pn = el('div','pn', '· ' + (spread*2 + side + 1) + ' ·');
    pn.style.left = x + 'px'; pn.style.width = pageW + 'px';
    f.append(rh, pn);
  });

  const cols = Math.max(1, Math.round(pages.scrollWidth / (pageW + GUTTER)));
  const spreads = Math.max(1, Math.ceil(cols / 2));
  if(spread >= spreads) spread = spreads - 1;
  if(spread < 0) spread = 0;
  pages.style.transform = `translateX(${-spread * (pageW * 2 + GUTTER)}px)`;

  const p = $('#pager');
  p.innerHTML = '';
  const prev = el('button', null, 'Back');
  prev.disabled = spread === 0;
  prev.onclick = ()=>{ spread--; layoutSpread(); };
  const next = el('button', null, 'Forward');
  next.disabled = spread >= spreads - 1;
  next.onclick = ()=>{ spread++; layoutSpread(); };
  const label = el('span','of', spreads === 1 ? `pages ${spread*2+1} and ${spread*2+2}`
                                              : `spread ${spread+1} of ${spreads}`);
  p.append(prev, label, next);
}
window.addEventListener('resize', ()=>layoutSpread());

const SAVE_KEY = 'almanac-guide-editor/draft';
let saveTimer = null;

function refresh(){
  const o = buildJson();
  $('#json').textContent = JSON.stringify(o, null, 2);
  // Preview walks the LIVE doc, not the built JSON: block identity is what
  // keys the preview-asset map (loaded images, parsed recipes).
  $('#book').innerHTML =
    '<div class="spreadview" id="spreadview"><div class="pages" id="pages">'
    + preview(doc) + '</div><div class="furniture" id="furniture"></div>'
    + '<div class="gutter" id="gutter"></div></div>';
  layoutSpread();

  const domain = (o.id||'').includes(':') ? o.id.split(':')[0] : 'yourdomain';
  const name = ((o.id||'').split(':').pop() || 'chapter').replace(/[^a-z0-9-_]/gi,'-').toLowerCase();
  $('#filename').textContent = `assets/${domain}/almanac/guides/${name}.json`;

  // One quiet status line; the detail is a click away rather than a wall of
  // coloured banners.
  const issues = validate(o);
  const errs = issues.filter(i=>i[0]==='err').length;
  const warns = issues.length - errs;
  const st = $('#status');
  const ul = $('#issues');
  st.className = 'status ' + (errs ? 'dirty' : 'clean');
  st.innerHTML = '';
  st.appendChild(el('span','dot'));
  st.appendChild(el('span', null,
    errs ? `${errs} thing${errs===1?'':'s'} to fix` + (warns?` and ${warns} to look at`:'')
         : warns ? `Ready, with ${warns} to look at`
                 : 'Ready to drop into your mod'));
  if(issues.length) st.appendChild(el('span','more', ul.hidden ? 'show' : 'hide'));
  st.onclick = ()=>{ if(!issues.length) return; ul.hidden = !ul.hidden; refresh(); };

  ul.innerHTML='';
  if(!issues.length) ul.hidden = true;
  issues.forEach(([k,msg])=>ul.appendChild(el('li',k,msg)));

  // Autosave: a refresh should never cost you a chapter.
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify(doc));
      const el2 = $('#saved');
      el2.textContent = 'saved';
      setTimeout(()=>{ if(el2.textContent==='saved') el2.textContent=''; }, 1600);
    }catch(e){ $('#saved').textContent = 'not saved'; }
  }, 400);
}

$('#tab-preview').onclick = ()=>{ $('#tab-preview').classList.add('on'); $('#tab-json').classList.remove('on');
  $('#pane-preview').hidden=false; $('#pane-json').hidden=true; };
$('#tab-json').onclick = ()=>{ $('#tab-json').classList.add('on'); $('#tab-preview').classList.remove('on');
  $('#pane-json').hidden=false; $('#pane-preview').hidden=true; };

$('#btn-copy').onclick = async ()=>{
  await navigator.clipboard.writeText(JSON.stringify(buildJson(), null, 2));
  const b=$('#btn-copy'); const t=b.textContent; b.textContent='Copied'; setTimeout(()=>b.textContent=t,1200);
};
$('#btn-download').onclick = ()=>{
  const o = buildJson();
  const name = ((o.id||'').split(':').pop() || 'chapter').replace(/[^a-z0-9-_]/gi,'-').toLowerCase()+'.json';
  const blob = new Blob([JSON.stringify(o,null,2)], {type:'application/json'});
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
};
/** Load a guide-pack object into the editor. Unknown fields are dropped on
 *  purpose: what round-trips is what the schema defines. */
function importDoc(o){
  doc = {schemaVersion:1, $schema:o.$schema||'', id:o.id||'', gate:o.gate||'', title:o.title||'', subtitle:o.subtitle||'',
         byline:o.byline||'', icon:o.icon||'', accentColor:o.accentColor||'',
         order:o.order??null, overview:!!o.overview, pinned:!!o.pinned,
         sections:(o.sections||[]).map(s=>({
           id:s.id||'', title:s.title||'', keepTogether:!!s.keepTogether,
           pageBreakBefore:!!s.pageBreakBefore, revealedBy:s.revealedBy||'', hint:s.hint||'',
           blocks:(s.blocks||[]).map(b=>{
             const nb = Object.assign(newBlock(b.type), b);
             // Materials/quest counts arrive as numbers; the row inputs are text.
             if(Array.isArray(nb.items)) nb.items = nb.items.map(it =>
               (it && typeof it === 'object')
                 ? Object.assign({}, it, it.count!=null ? {count:String(it.count)} : {})
                 : it);
             return nb;
           })
         }))};
  if(!doc.sections.length) doc.sections=[newSection()];
  render();
}
window.importDoc = importDoc;

$('#btn-import').onclick = ()=>$('#file').click();
$('#file').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{ importDoc(JSON.parse(r.result)); }
    catch(err){ alert('Could not read that JSON: '+err.message); }
  };
  r.readAsText(f); e.target.value='';
};
$('#btn-new').onclick = ()=>{
  if(!confirm('Start a new guide? The current one is replaced.')) return;
  doc = blankDoc(); render();
};

/* A real shipped guide, not an invented one: TCM's Smithing chapter. It shows
   the things an author actually needs to see working: per-block requires, a
   pinned chapter with an order, drop caps and a callout. The sections TCM's
   knowledge engine gates are left out, since those keys mean nothing outside
   TCM and would preview as locked hint lines. */
const EXAMPLE_GUIDE = "{\"schemaVersion\": 1, \"id\": \"almanactcm:smithing\", \"gate\": \"almanactcm\", \"pinned\": true, \"order\": 10, \"title\": \"Smithing\", \"subtitle\": \"The road to first metal\", \"byline\": \"set down by Venah\", \"accentColor\": \"#8a4b22\", \"sections\": [{\"id\": \"the-road\", \"title\": \"The road to first metal\", \"keepTogether\": true, \"blocks\": [{\"type\": \"paragraph\", \"dropcap\": true, \"text\": \"Metal does not come to you. It sits in the dark under the hills, bound in stone, and every hand that ever held a copper blade walked the same road to it: down, then back up, then through fire. These pages will not walk it for you. They fill in as you do, the way a smith's own notebook would.\"}, {\"type\": \"paragraph\", \"text\": \"Begin where every smith begins: with stone and patience. The ground gives ore to those who look for the stains it leaves in rock. What you carry up in your hands is not yet metal. It is a promise of metal, and promises must be worked.\"}, {\"type\": \"paragraph\", \"requires\": [\"industrialstory\"], \"text\": \"On this earth the old shortcuts are closed. Ore does not melt in a cookpot, and no clay vessel on a campfire will give you a blade. The first fire that answers is a humble one: a hole in the ground one block square, lined with <strong>clay</strong> and <strong>bone ash</strong>, charged with <strong>copper nuggets</strong>, and fed with <strong>charcoal</strong>. Fire alone tops out short of what copper demands. Something has to give the fire more air than the sky will; think on the <strong>reeds</strong> by the water.\"}, {\"type\": \"callout\", \"variant\": \"lore\", \"text\": \"The Almanac keeps its ink for the ones who do. Each of the pages after this one fills in when your own hands earn it, not when a trader's do.\"}]}, {\"id\": \"the-anvil\", \"title\": \"The anvil\", \"keepTogether\": true, \"blocks\": [{\"type\": \"paragraph\", \"dropcap\": true, \"requires\": [\"industrialstory\"], \"text\": \"No smith buys their first anvil. Somewhere near your fire stands a shoulder of bare rock, <strong>igneous or metamorphic</strong>, and it is an anvil that has not been asked yet. Crouch, take a <strong>stone hammer</strong> in hand, and press it to the stone's <strong>top face</strong>. The rock answers. What it becomes will hold every mass you win from the pit until bronze raises you something better.\"}]}]}";

$('#btn-example').onclick = ()=>{
  importDoc(JSON.parse(EXAMPLE_GUIDE));   // parse fresh so edits never touch the constant
};

// Restore the last draft. Losing a chapter to a stray refresh is the kind of
// thing that makes a tool untrustworthy.
try{
  const saved = localStorage.getItem(SAVE_KEY);
  if(saved){
    const d = JSON.parse(saved);
    if(d && Array.isArray(d.sections)) doc = d;
  }
}catch(e){ /* corrupt draft: start clean rather than fail to load */ }

render();
</script>
